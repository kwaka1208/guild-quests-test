name: Bug report
description: Report a typo, a broken link, or something that does not work.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting! Please **do not write answers or flags** here.
  - type: input
    id: quest
    attributes:
      label: Quest
      description: Which quest has the problem?
      placeholder: quest-00
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: What did you do? Write each step on a new line.
      placeholder: |
        1. Run `python quest.py --stage 2`
        2. Type `mira`
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What actually happened? Paste the error message if there is one.
      render: text
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows
        - macOS
        - Linux
        - Other
